<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My S3 Website</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #232f3e, #3a4a5e);
      color: #fff;
    }
    main {
      max-width: 36rem;
      padding: 2.5rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    h1 { margin-top: 0; }
    code {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      background: rgba(0, 0, 0, 0.35);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>🎉 Hello from Amazon S3!</h1>
    <p>If you can read this, your bucket is serving a public web page.</p>
    <p>This page is served from:</p>
    <p><code id="host"></code></p>
  </main>
  <script>
    document.getElementById("host").textContent = location.host;
  </script>
</body>
</html>
